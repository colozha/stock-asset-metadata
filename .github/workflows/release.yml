name: Release installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rpm:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 60
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git tar gzip curl-minimal ca-certificates python3 gh \
            gcc-c++ make pkgconf-pkg-config rpm findutils diffutils \
            webkit2gtk4.1-devel openssl-devel librsvg2-devel libxdo-devel \
            ghostscript ffmpeg-free

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/check-release-version.py

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features

      - name: Build frontend and RPM
        run: npm run bundle -- --ci -- --locked

      - name: Verify RPM and checksum
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/rpm/*.rpm)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          test "$(rpm -qp --queryformat '%{VERSION}' "$package")" = "$version"
          test "$(rpm -qp --queryformat '%{ARCH}' "$package")" = x86_64
          rpm -qp --requires "$package" > "$RUNNER_TEMP/rpm-requires.txt"
          grep -Fx ghostscript "$RUNNER_TEMP/rpm-requires.txt"
          grep -Fx ffmpeg-free "$RUNNER_TEMP/rpm-requires.txt"
          ldd src-tauri/target/release/stock-asset-metadata > "$RUNNER_TEMP/ldd.txt"
          cat "$RUNNER_TEMP/ldd.txt"
          if grep -F 'not found' "$RUNNER_TEMP/ldd.txt"; then
            exit 1
          fi
          cd src-tauri/target/release/bundle/rpm
          package="$(basename "$package")"
          sha256sum "$package" > "$package.sha256"
          sha256sum --check "$package.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-rpm
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.sha256

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python scripts/check-release-version.py
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }
      - name: Install preview tools for tests
        run: |
          choco install ghostscript ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Preview tool installation failed.' }
          # Chocolatey updates the machine PATH for later processes, not this runner.
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $machinePath.Split(';') | Where-Object { $_ } | Add-Content $env:GITHUB_PATH
      - name: Build and verify Windows installer
        run: ./scripts/build-windows.ps1
      - name: Test Windows backend and format roundtrips
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows backend tests failed.' }
      - name: Smoke test installed application
        run: |
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe -File)
          if ($installer.Count -ne 1) { throw 'Expected one installer.' }
          $destination = Join-Path $env:RUNNER_TEMP 'Stock Asset Metadata'
          $install = Start-Process $installer[0].FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $executable = Join-Path $destination 'stock-asset-metadata.exe'
          if (!(Test-Path $executable)) { throw 'Installed executable is missing.' }
          $app = Start-Process $executable -PassThru
          try {
            Start-Sleep -Seconds 10
            $app.Refresh()
            if ($app.HasExited -or $app.MainWindowHandle -eq 0) {
              throw 'Installed application did not open a window.'
            }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.sha256

  publish:
    needs: [rpm, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true
          path: release-assets
      - name: Verify all release assets
        working-directory: release-assets
        run: |
          shopt -s nullglob
          rpms=(*.rpm)
          installers=(*-setup.exe)
          checksums=(*.sha256)
          test "${#rpms[@]}" -eq 1
          test "${#installers[@]}" -eq 1
          test "${#checksums[@]}" -eq 2
          sha256sum --check -- *.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_PROMPT_DISABLED: '1'
        run: |
          # REST lookup by tag omits drafts; GraphQL also finds pending releases.
          state=$(gh api graphql \
            -f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" -f tag="$RELEASE_TAG" \
            -f query='query($owner: String!, $name: String!, $tag: String!) {
              repository(owner: $owner, name: $name) {
                release(tagName: $tag) { isDraft }
              }
            }' \
            --jq '.data.repository.release | if . == null then "missing" elif .isDraft then "draft" else "public" end')
          assets=(release-assets/*.rpm release-assets/*-setup.exe release-assets/*.sha256)
          case "$state" in
            draft)
              gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
              ;;
            missing)
              gh release create "$RELEASE_TAG" "${assets[@]}" \
                --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
              ;;
            public)
              echo 'Release is already public; assets will not be replaced.' >&2
              exit 1
              ;;
            *)
              echo "Unexpected release state: $state" >&2
              exit 1
              ;;
          esac
          gh release edit "$RELEASE_TAG" --draft=false --latest
