[package]
name = "stock-asset-metadata"
version = "0.1.2"
description = "Local metadata editor for microstock assets"
edition = "2021"
rust-version = "1.88"

[lib]
name = "stock_asset_metadata_lib"
path = "src/lib.rs"

[[bin]]
name = "stock-asset-metadata"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:reqwest", "dep:keyring", "dep:base64"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
keyring = { version = "4.2", optional = true }
base64 = { version = "0.22", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xmp_toolkit = "=1.12.1"
quick-xml = "0.42"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
resvg = "0.48.1"
sha2 = "0.10"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
